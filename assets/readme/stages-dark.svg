<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Proposed: counted before measured, Backtested: in sample, overfit-checked, Unseen-tested: read once, pass or fail, On trial: 60 days, frozen first, Listed: four gates in code. Every listed strategy is rechecked daily." font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1280" height="300" rx="16" fill="#0f1a1f"/><rect x="70" y="48" width="204" height="60" rx="30" fill="#1b2429" stroke="#273035" stroke-width="2"/><text x="172" y="85" text-anchor="middle" font-size="20" font-weight="500" fill="#f6fefd">Proposed</text><text x="172" y="138" text-anchor="middle" font-size="15" fill="#949e9c">counted before measured</text><rect x="304" y="48" width="204" height="60" rx="30" fill="#1b2429" stroke="#273035" stroke-width="2"/><text x="406" y="85" text-anchor="middle" font-size="20" font-weight="500" fill="#f6fefd">Backtested</text><text x="406" y="138" text-anchor="middle" font-size="15" fill="#949e9c">in sample, overfit-checked</text><rect x="538" y="48" width="204" height="60" rx="30" fill="#1b2429" stroke="#273035" stroke-width="2"/><text x="640" y="85" text-anchor="middle" font-size="20" font-weight="500" fill="#f6fefd">Unseen-tested</text><text x="640" y="138" text-anchor="middle" font-size="15" fill="#949e9c">read once, pass or fail</text><rect x="772" y="48" width="204" height="60" rx="30" fill="#1b2429" stroke="#273035" stroke-width="2"/><text x="874" y="85" text-anchor="middle" font-size="20" font-weight="500" fill="#f6fefd">On trial</text><text x="874" y="138" text-anchor="middle" font-size="15" fill="#949e9c">60 days, frozen first</text><rect x="1006" y="48" width="204" height="60" rx="30" fill="#1b2429" stroke="#97fce4" stroke-width="2"/><text x="1108" y="85" text-anchor="middle" font-size="20" font-weight="500" fill="#f6fefd">Listed</text><text x="1108" y="138" text-anchor="middle" font-size="15" fill="#949e9c">four gates in code</text><g fill="none" stroke="#949e9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M280 78H298M292 72L298 78L292 84"/><path d="M514 78H532M526 72L532 78L526 84"/><path d="M748 78H766M760 72L766 78L760 84"/><path d="M982 78H1000M994 72L1000 78L994 84"/><path d="M1108 154V198Q1108 218 1088 218H426Q406 218 406 198V154M400 160L406 154L412 160"/></g><text x="757" y="250" text-anchor="middle" font-size="16" fill="#949e9c">Rechecked daily. One that slips is being upgraded until a stronger candidate replaces it.</text></svg>
