[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-contract"
version = "2.0.0"
description = "The standard Archon lists a strategy by, and the verifier of its hash-chained record, as pure functions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/archonHL/archon"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
